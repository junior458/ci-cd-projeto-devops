name: Discord Alert

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Notification
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{"content":"🚀 Novo push realizado no repositório ci-cd-projeto-devops na branch main!"}' \
          ${{ secrets.DISCORD_WEBHOOK }}
